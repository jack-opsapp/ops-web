name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: the dedicated `build` job that previously lived here was removed.
# The repo has no GitHub Actions secrets configured, so `next build`
# failed at page-data-collection time the moment it imported any API
# route that initializes Supabase / Firebase / SendGrid at module load
# (e.g. /api/admin/whats-new/categories — "Error: supabaseUrl is required").
# The failure was masked for months because the upstream `lint-and-test`
# job has been red since #5, which kept the `build` job in SKIPPED state.
#
# The Vercel deployment that fires on every push runs the same `next build`
# against the real production environment variables — that is the
# authoritative build verification. Re-introducing a secrets-less build
# step here would just duplicate work in an environment that cannot
# possibly succeed. If a CI-side build check is wanted later, wire in
# secrets.NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, the
# Firebase keys, and SENDGRID_API_KEY first, then restore the job.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Grant the postgres user traversal into the workspace
        run: |
          set -euo pipefail
          target="$PWD/tests/sql/mcp-v3-synthetic-canary-runtime.sql"
          echo "::group::Workspace path permissions before"
          namei -lx "$target"
          sudo -u postgres id
          echo "::endgroup::"
          # Every SQL contract step below runs psql as the `postgres` unix user,
          # but the checkout lives under /home/runner, which the runner image
          # creates 0750 runner:runner. postgres is not in the `runner` group
          # (uid=112, groups=117(postgres),115(ssl-cert)), so it lands in the
          # "other" class with no permissions at all. The steps that pass a RELATIVE
          # `-f` path survive only by accident: a relative lookup resolves from
          # the CWD the process already inherited and never re-checks search
          # permission on the ancestors above it. The moment a step resolves an
          # ABSOLUTE path -- as tests/sql/mcp-v3-synthetic-canary-concurrency.sh
          # does, via `pwd -P` -- resolution restarts at / and is denied at
          # /home/runner. Grant search (x) for others on that one directory:
          # `x` permits path traversal only. Listing it still requires `r`,
          # writing still requires `w`, and every file keeps its own mode, so
          # nothing becomes readable that a process with a known path could not
          # already reach. The runner is ephemeral and single-tenant.
          sudo chmod o+x /home/runner
          echo "::group::Workspace path permissions after"
          namei -lx "$target"
          echo "::endgroup::"
          # Assert the whole chain, not just the one directory we changed, so a
          # future runner image that tightens a different ancestor fails here
          # with the namei output above rather than deep inside a test script.
          sudo -u postgres test -r "$target" || {
            echo "postgres cannot read the workspace via an absolute path" >&2
            exit 1
          }
      - name: Start PostgreSQL for migration contracts
        run: sudo systemctl start postgresql.service
      - name: Test email attachment reconciliation migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/email-conversion-photo-related-attachment-shadowing-contract.sql
      - name: Test phase C work claim null-safety migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/phase-c-claim-null-safe-contract.sql
      - name: Test contact-form provenance gate migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/contact-form-provenance-gate-contract.sql
      - name: Test delivery-source normalization re-projection migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/delivery-source-reprojection-contract.sql
      - name: Test day-closeout routine configuration migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/agent-day-closeout-routine-configuration-runtime.sql
      - name: Test MCP v3 synthetic canary migration
        run: >-
          sudo -u postgres psql -X -v ON_ERROR_STOP=1
          -f tests/sql/mcp-v3-synthetic-canary-runtime.sql
      - name: Test MCP v3 canary shutdown serialization
        run: sudo -u postgres bash tests/sql/mcp-v3-synthetic-canary-concurrency.sh
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --reporter=verbose
